<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>课程表</title>
    <style id="expo-reset">
      html,
      body {
        height: 100%;
      }
      body {
        overflow: hidden;
      }
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
  </head>

  <body>
    <noscript>
      需要启用 JavaScript 才能运行这个应用。
    </noscript>
    <div id="root"></div>
    <script>
      (function () {
        // GitHub Pages 对任意不存在的路径统一返回根目录 404.html。
        // 这里根据路径前缀选择正确的应用包：/course-schedule/solo/* → 单机版，其余 → 云同步版。
        var isSolo = location.pathname.indexOf('/course-schedule/solo') === 0;
        var src = isSolo
          ? '/course-schedule/solo/_expo/static/js/web/entry-5fb4794c1885119f57cc0ff2a76508ef.js'
          : '/course-schedule/_expo/static/js/web/entry-1afeb61707d56e07f8e565f66bd05353.js';
        var s = document.createElement('script');
        s.src = src;
        s.defer = true;
        document.body.appendChild(s);
      })();
    </script>
  </body>
</html>
